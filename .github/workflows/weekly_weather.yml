name: Weekly weather forecast

on:
  schedule:
    # Тестовый запуск: 22.06 в 16:28 по Москве.
    - cron: "28 16 22 6 *"
      timezone: "Europe/Moscow"

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  send-weather:
    runs-on: ubuntu-latest

    env:
      WEATHER_CITY: "Талдом, Московская область"
      WEATHER_LAT: "56.7333"
      WEATHER_LON: "37.5333"
      WEATHER_TIMEZONE: "Europe/Moscow"
      WEATHER_MODEL: "ecmwf_ifs025"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weather forecast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weather_bot.py